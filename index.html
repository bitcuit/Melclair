<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spincard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@500;600;700&family=Gowun+Dodum&family=Do+Hyeon&family=Jua&family=Black+Han+Sans&family=Orbit&family=Noto+Serif+KR:wght@500;600;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@500;600;700&family=Song+Myung&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root {
    --bg: #f4f3f0;
    --panel: #ffffff;
    --line: #e2e0db;
    --text: #1d1c1a;
    --dim: #7a7771;
    --accent: #1d1c1a;
    --accent-text: #ffffff;
    --soft: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --line: #33322f; --text: #eceae5;
      --dim: #94918a; --accent: #eceae5; --accent-text: #161615; --soft: #2a2927;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 400px 1fr;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    height: 100vh; overflow-y: auto; padding: 22px 24px 28px;
    display: flex; flex-direction: column; gap: 22px;
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  section { display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 12px; color: var(--dim); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--dim); }
  textarea { resize: vertical; min-height: 150px; line-height: 1.6; }
  input[type=number] { width: 72px; flex: none; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--soft); border-radius: 9px; padding: 3px; }
  .seg button {
    font: inherit; border: 0; background: transparent; color: var(--dim);
    padding: 7px 0; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed=true] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn {
    font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--dim); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--soft); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 20px; padding: 0; cursor: pointer;
  }
  .drop {
    border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--dim); cursor: pointer;
  }
  .drop.over { border-color: var(--text); color: var(--text); }
  .hint { font-size: 12px; color: var(--dim); white-space: nowrap; flex: none; }
  input[type=color] { width: 40px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); flex: none; }
  .wave { position: relative; height: 64px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; cursor: crosshair; touch-action: none; }
  .wave canvas { width: 100%; height: 100%; display: block; }
  .file-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  .file-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row button { border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 15px; padding: 0 4px; }
  .msg { font-size: 12px; color: var(--dim); }
  .msg:empty { display: none; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { accent-color: var(--text); width: 16px; height: 16px; margin: 0; }
  .btn.tapping { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  details.notes summary { cursor: pointer; font-size: 12px; color: var(--dim); font-weight: 600; padding: 2px 0; }
  details.notes[open] summary { margin-bottom: 8px; }
  .note-list { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
  .note-row { display: flex; flex-direction: column; gap: 4px; }
  .note-row .src { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-row input { padding: 6px 9px; font-size: 13px; }
  .picker {
    position: absolute; inset: 0; background: var(--bg); z-index: 5;
    display: flex; flex-direction: column; padding: 20px 24px; gap: 16px;
  }
  .picker[hidden] { display: none; }
  .picker-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .picker-bar .seg { width: 200px; }
  .picker-bar select { width: auto; }
  .picker-bar .grow { flex: 1; }
  .picker-grid {
    flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px; align-content: start; padding: 4px;
  }
  .pick { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 10px; position: relative; font: inherit; color: inherit; text-align: left; }
  .pick canvas { width: 100%; display: block; border-radius: 10px; outline: 2px solid transparent; outline-offset: 2px; }
  .pick[aria-pressed=true] canvas { outline-color: var(--text); }
  .pick .mark {
    position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,.45); border: 1.5px solid #fff; color: #fff; font-size: 13px; line-height: 19px; text-align: center;
  }
  .pick[aria-pressed=false] .mark { color: transparent; }
  .pick[aria-pressed=true] .mark { background: var(--text); border-color: var(--text); color: var(--bg); }
  .pick .cap { font-size: 12px; color: var(--dim); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main {
    position: relative;
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; min-width: 0;
    overflow: hidden;
  }
  #stage { max-height: calc(100vh - 180px); max-width: 100%; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.12); touch-action: none; }
  #stage.can-pan { cursor: grab; }
  #stage.panning { cursor: grabbing; }
  .player { display: flex; align-items: center; gap: 12px; width: min(480px, 100%); }
  .player input[type=range] { flex: 1; accent-color: var(--text); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; width: 78px; text-align: right; }
  .save { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .status { font-size: 12px; color: var(--dim); min-height: 18px; font-variant-numeric: tabular-nums; text-align: center; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; }
    aside { height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 18px 16px; }
    main { height: auto; padding: 20px 16px 32px; }
    #stage { max-height: none; width: 100%; }
  }
</style>
</head>
<body>
<aside>
  <h1>Spincard</h1>

  <section>
    <div class="seg" id="mode">
      <button data-v="player" aria-pressed="true">음악 플레이어</button>
      <button data-v="cd" aria-pressed="false">CD 플레이어</button>
    </div>
  </section>

  <section>
    <span class="label">이미지</span>
    <div class="thumbs" id="thumbs"></div>
    <label class="drop" id="drop">이미지 추가<input type="file" id="file" accept="image/*" multiple hidden></label>
    <div class="row"><span class="hint" style="flex:1">여러 장이면</span><input type="number" id="imgSec" min="0.5" step="0.5" value="3"><span class="hint">초마다 바꾸기</span></div>
    <span class="hint">미리보기에서 이미지를 끌면 위치, 휠로 확대, 두 번 누르면 원래대로</span>
    <div class="row">
      <span class="hint" style="flex:1">그라디언트 맵</span>
      <select id="gmap" style="width:150px">
        <option value="">없음</option>
        <option value="dawn">새벽</option>
        <option value="sea">바다</option>
        <option value="sunset">노을</option>
        <option value="mono">흑백</option>
        <option value="sepia">세피아</option>
        <option value="neon">형광</option>
        <option value="custom">직접 고르기</option>
      </select>
      <input type="color" id="gmA" value="#1a1446" aria-label="어두운 쪽 색" hidden>
      <input type="color" id="gmB" value="#ffd9a8" aria-label="밝은 쪽 색" hidden>
    </div>
    <label class="check"><input type="checkbox" id="imgGlitch">이미지 글리치</label>
  </section>

  <section>
    <span class="label">노래</span>
    <input type="text" id="title" placeholder="제목">
    <input type="text" id="artist" placeholder="가수">
    <label class="drop" id="audioDrop">노래 파일 넣기<input type="file" id="audioFile" accept="audio/*" hidden></label>
    <div id="audioBox" hidden>
      <div class="file-row"><span id="audioName"></span><button id="audioRemove" aria-label="노래 빼기">×</button></div>
      <div class="wave" id="wave"><canvas id="waveCanvas"></canvas></div>
      <div class="row" style="margin-top:8px">
        <span class="hint">구간</span>
        <input type="text" id="segA" aria-label="구간 시작">
        <span class="hint">~</span>
        <input type="text" id="segB" aria-label="구간 끝">
      </div>
    </div>
  </section>

  <section>
    <span class="label">가사</span>
    <textarea id="lyrics" placeholder="한 줄에 한 소절"></textarea>
    <div class="row">
      <button class="btn" id="findLyrics">가사 찾기</button>
      <button class="btn" id="tap" disabled>박자 찍기</button>
    </div>
    <div class="msg" id="lyricMsg"></div>
    <details class="notes" id="notesBox"><summary>발음 · 번역</summary><div class="note-list" id="noteList"></div></details>
    <div class="row">
      <span class="hint" style="flex:1">효과</span>
      <div class="seg" id="fx" style="width:180px">
        <button data-v="fade" aria-pressed="true">페이드</button>
        <button data-v="glitch" aria-pressed="false">글리치</button>
      </div>
    </div>
    <div class="row"><span class="hint" style="flex:1">박자 없는 줄은 한 줄당</span><input type="number" id="lineSec" min="0.5" step="0.5" value="3"><span class="hint">초</span></div>
    <div class="row"><span class="hint" style="flex:1">가사 늦추기</span><input type="number" id="shift" step="0.1" value="0"><span class="hint">초</span></div>
  </section>

  <section>
    <span class="label">글꼴</span>
    <select id="font">
      <option value="Pretendard">프리텐다드</option>
      <option value="Noto Sans KR">본고딕 (Noto Sans KR)</option>
      <option value="IBM Plex Sans KR">IBM Plex Sans KR</option>
      <option value="Gowun Dodum">고운 돋움</option>
      <option value="Do Hyeon">도현</option>
      <option value="Jua">주아</option>
      <option value="Black Han Sans">검은고딕</option>
      <option value="Orbit">오르빗</option>
      <option value="Galmuri11">갈무리 (픽셀)</option>
      <option value="Noto Serif KR">본명조 (Noto Serif KR)</option>
      <option value="Nanum Myeongjo">나눔명조</option>
      <option value="Gowun Batang">고운 바탕</option>
      <option value="Hahmlet">함렛</option>
      <option value="Song Myung">송명</option>
      <option value="Nanum Pen Script">나눔손글씨 펜</option>
    </select>
  </section>

  <section>
    <span class="label">배경</span>
    <div class="row">
      <div class="seg" id="bgMode" style="flex:1">
        <button data-v="blur" aria-pressed="true">이미지 흐리게</button>
        <button data-v="solid" aria-pressed="false">단색</button>
      </div>
      <input type="color" id="bgColor" value="#232220">
    </div>
    <label class="check"><input type="checkbox" id="glowOn" checked>주변 빛</label>
  </section>

  <section>
    <span class="label">크기</span>
    <div class="row">
      <select id="size">
        <option value="360">360 × 480</option>
        <option value="480" selected>480 × 640</option>
        <option value="600">600 × 800</option>
        <option value="720">720 × 960</option>
      </select>
      <select id="fps">
        <option value="10">GIF 초당 10장</option>
        <option value="20" selected>GIF 초당 20장</option>
        <option value="25">GIF 초당 25장</option>
      </select>
    </div>
  </section>
</aside>

<main>
  <canvas id="stage"></canvas>
  <div class="player">
    <button class="btn" id="play" aria-label="일시정지">❚❚</button>
    <input type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="재생 위치">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <div class="save">
    <button class="btn primary" id="saveMp4">MP4 저장</button>
    <button class="btn" id="saveGif">GIF 저장</button>
    <button class="btn" id="saveStill">이미지 저장</button>
  </div>
  <div class="status" id="status"></div>
  <div class="picker" id="picker" hidden>
    <div class="picker-bar">
      <div class="seg" id="unit">
        <button data-v="line" aria-pressed="true">줄마다</button>
        <button data-v="para" aria-pressed="false">문단마다</button>
      </div>
      <select id="stillFmt" aria-label="파일 형식"><option value="png">PNG</option><option value="jpg">JPG</option></select>
      <span class="grow"></span>
      <span class="hint" id="pickCount"></span>
      <button class="btn" id="pickAll">모두 고르기</button>
      <button class="btn primary" id="pickSave" disabled>저장</button>
      <button class="btn" id="pickClose">닫기</button>
    </div>
    <div class="picker-grid" id="pickGrid"></div>
  </div>
</main>

<script src="vendor/gifenc.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script src="app.js"></script>
</body>
</html>
